name: Hourly Water Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-water:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run water monitor
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: |
          python water_monitor.py

      - name: Commit and push changes (if state updated)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_state.json
          git diff --staged --quiet || (git commit -m "chore: update last water state" && git push)
